# THUG2's game code was built with SN Systems ProDG (GCC 2.95.2 "ngccc"),
# NOT Metrowerks mwcc — see docs/gamecube-decomp-plan.md §5. The CRT/runtime
# objects are mwcc-era; game-code objects are compiled by ngccc via the
# ProDG/<ver> mw_version in configure.py (selected per-object in project.py).
# mw_comment_version only affects parsing of mwcc comment sections during
# analysis; leave at 11.
mw_comment_version: 11

# THUG2 was compiled with -sdata2 0 (all small data via r13), but dtk
# classifies the second small-data region (.sdata2 @ 0x803CAF80) as r2
# addressed. tools/patch_dol.py rewrites those accesses to r13 after linking.
# The template hardcodes _stack_end = 0x803CC200 (END of .sdata2, not its
# 0x803CAF80 start): the original __start computes the initial stack pointer
# _stack_addr = (_stack_end + 0x10006) & ~0x7 = 0x803DC200 ("ori r1,r1,0xc200").
# Note: ProDG game code is additionally built with -G0 (no small data), so
# decompiled game objects carry no sdata sections at all.
ldscript_template: config/G2TE52/ldscript.tpl

# Neversoft engine uses computed jump tables (mtlr r0 / blrl dispatch)
# that stall control-flow analysis. Skip the affected range.
skip_cfa_ranges:
- start: .text:0x8025B92C
  end: .text:0x80261D5C

# Force-active symbols: survive mwld dead-stripping even though nothing
# references them. __GXGetTexTileShift (standalone copy kept by retail's
# linker) and HW2GXFiltConv (unreferenced SDK table) both live in the
# GXTexture object and must be emitted. GXGetOverflowCount (8B sdata read in
# GXFifo.c) has no caller in the wired objects (DEMOInit.c not linked yet).
# DCStoreRangeNoSync (os/OSCache.c) is only called from raw-address game asm
# at 0x8025FB48 (inside a skip_cfa/gap region, so dtk emits no relocation)
# — mwld would dead-strip it and shift the whole OSCache region by 0x2C.
force_active:
- __GXGetTexTileShift
- HW2GXFiltConv
- GXGetOverflowCount
- DCStoreRangeNoSync
- GXInitLightSpot
